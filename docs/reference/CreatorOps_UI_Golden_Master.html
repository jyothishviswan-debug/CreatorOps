class CreatorOpsRefinedOverview extends HTMLElement{
  connectedCallback(){
    if(this.shadowRoot)return;
    const shadow=this.attachShadow({mode:'open'});
    shadow.append(document.getElementById('refined-overview-style').content.cloneNode(true));
    shadow.append(document.getElementById('refined-overview-template').content.cloneNode(true));
    this.current=this.getAttribute('module')||'dashboard';
    this.state='normal';
    this.$=id=>shadow.getElementById(id);
    this.$('module-select').innerHTML=Object.entries(OV_DATA).map(([k,d])=>`<option value="${k}">${ovEsc(d.title)} Overview</option>`).join('');
    this.$('module-select').value=this.current;
    this.$('scenario').value=this.state;
    this.$('module-select').addEventListener('change',e=>navigate(OV_KEY_TO_MODULE[e.target.value]||'dashboard'));
    this.$('scenario').addEventListener('change',e=>{this.state=e.target.value;this.renderOverview()});
    this.$('overview').addEventListener('click',()=>this.renderOverview());
    this.$('workspace').addEventListener('click',()=>openWorkspace());
    shadow.addEventListener('click',e=>{
      if(e.target.closest('[data-retry]')){this.state='normal';this.$('scenario').value='normal';this.renderOverview();return}
      const drill=e.target.closest('[data-drill]');if(drill){this.openDrill(drill.dataset.drill);return}
      if(e.target.closest('#back-overview'))this.renderOverview();
    });
    this.renderOverview();
  }
  openDrill(label){
    const d=OV_DATA[this.current];
    dialog(label,`<p>This preview links “${ovEsc(label)}” to the ${ovEsc(d.title)} workspace. The real application would apply the relevant record filters and authorization checks. No records, payments or accounts are changed here.</p><div class="scopebox">Overview context is preserved when you continue to the workspace.</div>`,btn('Close',"closeDialog()")+btn('Inspect workspace',"closeDialog();openWorkspace()",true,'arrow'));
  }
  renderOverview(){
    ovCurrent=this.current;
    const d=OV_DATA[this.current],state=this.state;
    this.$('canvas').dataset.state=state;
    this.$('title').textContent=d.title;
    this.$('desc').textContent=d.desc;
    this.$('eyebrow').innerHTML=ovIcon(10)+ovEsc(d.eyebrow);
    this.$('context-title').textContent=d.summary;
    this.$('context-icon').innerHTML=ovIcon(Object.keys(OV_DATA).indexOf(this.current));
    this.$('module-select').value=this.current;
    this.$('overview').classList.add('selected');this.$('workspace').classList.remove('selected');
    this.$('page-count').textContent=(Object.keys(OV_DATA).indexOf(this.current)+1)+' / 11 Overviews · Revision 2';
    this.$('body').innerHTML=(state==='partial'?'<div class="notice">Partial snapshot · one section is unavailable. Other sections remain usable; missing data is not zero.</div>':state==='sparse'?'<div class="notice">Sparse-state preview · only one entry per section; aggregate KPIs and conclusions are withheld.</div>':'')+
    `<div class="kpis" style="--n:${d.kpis.length}">${d.kpis.map((k,i)=>`<button class="kpi" style="--kpi-accent:${ovKpiAccent(this.current,i)}" data-drill="${ovEsc(k[0])}"><span class="kpi-icon" style="${ovTone(i)}">${ovIcon(i+2)}</span><span class="kpi-text"><span class="kpi-label">${ovEsc(k[0])}</span><div class="kpi-value ${String(k[1]).length>9?'word':''}">${state==='empty'?(typeof k[1]==='number'?'0':'—'):['error','loading','sparse'].includes(state)?'—':ovEsc(k[1])}</div><small>${['normal','partial'].includes(state)?ovEsc(k[2]):state==='empty'?'No period data':state+' preview'}</small></span></button>`).join('')}</div><div class="row primary">${d.top.map((p,i)=>ovRenderPanel(p,i,state,false)).join('')}</div><div class="row secondary">${d.bottom.map((p,i)=>ovRenderPanel(p,i,state,true)).join('')}</div>`;
  }
}

function foundation(){return header('The design foundation','A complete visual language for a calmer, more capable CreatorOps.','DESIGN SYSTEM / FINAL DIRECTION',btn('Explore dashboard',"navigate('dashboard')",true,'arrow'))+`<div class="hero"><div class="herocopy"><div class="eyebrow">CLARITY AT EVERY SCALE</div><h1>Complex operations.<br>Considered simplicity.</h1><p>A single global shell. Purposeful page compositions. Detail where it matters, and clear next actions wherever work happens.</p><div class="actions">${btn('Browse screen patterns',"document.getElementById('patterns').scrollIntoView({behavior:'smooth'})",true,'layers')}${btn('Try a workspace',"navigate('creators','workspace')")}</div></div><div class="herovisual"><div class="minimock"><div class="minitop"><b>Programme overview</b><span>September 2026</span></div><div class="minikpis"><div>Creators<b>128</b></div><div>Campaigns<b>12</b></div><div>Delivered<b>342</b></div></div><div class="minibars">${[26,43,36,61,52,70,55,85,76,94,86,100].map(h=>`<i style="height:${h}%"></i>`).join('')}</div><div class="minitop" style="padding-top:12px;border:0"><span>Performance with context</span><span>Inspect →</span></div></div></div></div><div class="banner">${icon('layers')}<span><b>One coherent system.</b> This standalone review proposes the visual direction. The app’s development-only foundation route should become its live implementation reference.</span></div>${sectionLabel('01','Visual language','Warm emphasis, neutral surfaces, and semantic colour with restraint.')}<div class="tokenrow">${[['Action orange','#C94C16'],['Accent orange','#EE692B'],['Navigation','#19212B'],['Canvas','#F5F6F8'],['Success','#17785A'],['Information','#326BA9']].map(x=>`<div class="token"><div class="color" style="background:${x[1]}"></div><div><b>${x[0]}</b><small>${x[1]}</small></div></div>`).join('')}</div><div class="grid" style="margin-top:18px">${panel('Typography','A deliberate hierarchy, without oversized labels',`<div style="font-size:29px;letter-spacing:-1px;font-weight:650">Programme overview</div><p style="font-size:12px;color:var(--muted);margin:9px 0 20px">Useful context should be readable, quiet, and close to the decision.</p><div class="spec"><div><b>29 / 36 · Page title</b><p>16 / 24 · Section title<br>14 / 21 · Body copy<br>12 / 18 · Controls & supporting copy</p></div><div><b>Tabular numbers</b><p style="font-size:26px;font-variant-numeric:tabular-nums;color:var(--ink)">2,480,000</p><p>Consistent alignment for comparisons.</p></div></div>`,6)}${panel('Interaction vocabulary','Familiar controls with one clear primary action',`<div class="actions">${btn('Primary action',"toast('Primary action preview')",true,'plus')}${btn('Secondary',"toast('Secondary action preview')")}${btn('Quiet action',"toast('Quiet action preview')")}</div><div class="actions" style="margin-top:18px">${pill('Active')}${pill('In review','orange')}${pill('In progress','blue')}${pill('Blocked','red')}${pill('Draft','gray')}</div><p class="foundationnote" style="margin-top:18px">Status always includes text. Orange communicates action; green communicates success. Destructive choices require deliberate confirmation.</p>`,6)}</div>${sectionLabel('02','Composition & density','Use available width intelligently. Size each section for its content.')}<div class="grid">${panel('Layout rules','One canvas family, adapted to the job',`<div class="spec"><div><b>Overview / Workspace</b><p>Wide canvas capped at 1,590px. Compact KPI rows. Twelve-column grids with purposeful 8/4, 6/6 and 4/4/4 compositions.</p></div><div><b>Detail / Create / Edit</b><p>Persistent context before local tabs. Forms capped at 1,080px. Group related information side by side; do not stretch every section.</p></div><div><b>Spacing & density</b><p>4px base rhythm. 14–18px grid gaps. 16–22px panel padding. Natural card height; no empty height added for decoration.</p></div><div><b>Responsive shell</b><p>Full navigation above 1,050px; compact rail down to 761px; dismissible menu on mobile. Cards reflow without scaling the whole screen.</p></div></div>`,8)}${panel('One shell. Local navigation.','No nested module sidebar',`<div style="padding:14px;background:#f5f6f8;border:1px solid var(--line);border-radius:8px"><b style="font-size:12px">Administration</b><div class="tabs" style="margin-top:16px"><span class="tab active">Overview</span><span class="tab">Users</span><span class="tab">Access review</span></div><div class="skeleton" style="width:85%"></div><div class="skeleton" style="width:65%"></div></div>`,4)}</div><div id="patterns">${sectionLabel('03','Canonical page patterns','Rendered examples and interactive destinations, in one system.')}</div>${metricCards(modules.dashboard)}<div class="grid">${panel('Overview pattern','Performance beside priority work',lineChart(),8)}${panel('Attention pattern','Specific queues, visible context, direct action',attention(modules.dashboard),4)}</div><div class="grid three">${panel('Delivery context','Compact linked-record section',`<div class="kv"><span>Campaign</span><b>Community Stories</b></div><div class="kv"><span>Content</span><b>Instagram Reel · 01</b></div><div class="kv"><span>Due</span><b>18 Sep 2026</b></div>`,4)}${panel('Workflow context','Status and responsibility',`<div class="kv"><span>State</span>${pill('Submitted','orange')}</div><div class="kv"><span>Owner</span><b>Meera Das</b></div><div class="kv"><span>Next action</span><b>Review submission</b></div>`,4)}${panel('Notes & meetings','Keep related context in the same row',`<p class="detailcopy">Brief confirmed. First draft is ready for review before publication.</p><small style="display:block;margin-top:12px">Meera Das · 14 Sep 2026</small>`,4)}</div><div class="coverage">${[['Workspace','creators','workspace','Search, status filters, table / cards'],['Assignment detail','assignments','detail','Header → context → local tabs'],['Create / edit','discovery','form','Progressive, validated, contextual'],['Analytics','analytics','overview','Native metrics and source coverage'],['Finance','finance','overview','Obligations and payment evidence'],['Administration','administration','workspace','Identity, role and explicit scope']].map(r=>`<button onclick="navigate('${r[1]}','${r[2]==='workspace'?'workspace':'overview'}');${r[2]==='detail'?'openDetail(0)':r[2]==='form'?'showForm()':''}"><span class="tile">${icon(modules[r[1]].icon)}</span><span><b>${r[0]}</b><small>${r[3]}</small></span></button>`).join('')}</div>${sectionLabel('04','System states','A missing value is not zero. A denied action is not an empty workspace.')}<div class="stategrid">${stateCards()}</div>${sectionLabel('05','Workflow contracts','Simpler presentation preserves important product distinctions.')}<div class="grid">${panel('Domain boundaries','Keep source truth and operational responsibility clear',`<div class="spec"><div><b>Discovery → Creator</b><p>Preserve separate identities. Check canonical identifiers automatically. Conversion requires readiness and authorized action.</p></div><div><b>Assignment → Deliverable</b><p>An assignment owns creator work; deliverables own individual content items. Inspecting a stage never silently advances the lifecycle.</p></div><div><b>Agreement → Analytics</b><p>Agreement defines a target. Analytics owns measured actuals. Missing evidence remains unknown; non-payment targets never alter payables.</p></div><div><b>Identity → Effective access</b><p>Role, scope, sensitivity and lifecycle all matter. A visual permission preview cannot grant or certify real authorization.</p></div></div>`,8)}${panel('Dialog & feedback patterns','Review before consequential changes',`<p class="foundationnote">Use compact dialogs for focused decisions. Keep complex editing on a dedicated page. Return clear success, conflict, or recovery feedback.</p><div class="actions" style="margin-top:18px">${btn('Review dialog',"reviewDialog()")}${btn('Conflict state',"conflictDialog()")}</div>`,4)}</div>${sectionLabel('06','Module coverage','Different questions. Shared typography, controls and composition.')}<div class="coverage">${Object.entries(modules).map(([id,m])=>`<button onclick="navigate('${id}')">${icon(m.icon)}<span><b>${m.name}</b><small>Overview & workspace preview</small></span></button>`).join('')}</div>${sectionLabel('07','Implementation handoff','Carry the design into the application without losing the workflow.')}<section class="panel"><div class="panelbody"><div class="spec"><div><b>Reuse the existing domain model</b><p>Extend the app’s V2 primitives and shell rather than adding a parallel module framework. Use current enums, service boundaries and record relationships as implementation authority.</p></div><div><b>Keep data access bounded</b><p>Real workspaces need scoped cursor pagination. Overview drill-downs must carry filters. Avoid fetching entire datasets to render summary cards or export reports.</p></div><div><b>Implement every state</b><p>Loading, empty, no results, partial, stale, error, denied, not found and conflict. Keep valid sections usable when one source fails.</p></div><div><b>Certify at real widths</b><p>Check resized desktop, tablet and mobile. Verify keyboard focus, labels, dialog dismissal, readable charts and table overflow. Validate real role/scope behavior separately.</p></div></div><div class="scopebox">Review provenance: supplied repository structure, V2 primitives, domain types, representative screens, current handoff notes and all three HTML references. This is a visual foundation, not a production certification or a claim that every proposed report or target is implemented.</div></div></section>`}

function dialog(title,body,footer=''){const d=$('dialog');d.innerHTML=`<div class="dialoghead"><h2 id="dialogtitle">${title}</h2><button class="iconbutton" aria-label="Close dialog" onclick="closeDialog()">×</button></div><div class="dialogbody">${body}</div>${footer?`<div class="dialogfoot">${footer}</div>`:''}`;if(!d.open)d.showModal()}function closeDialog(){$('dialog').close()}
function openSearch(){dialog('Find a module or pattern','<label class="field">Search the foundation<input autofocus id="globalsearch" type="search" placeholder="Try Finance, detail, or foundation…" oninput="searchResults(this.value)"></label><div class="searchresults" id="searchresults"></div>');searchResults('');$('globalsearch').focus()}function searchResults(q){const entries=[...Object.entries(modules).map(([id,m])=>[id,m.name]),['foundation','Design foundation']];$('searchresults').innerHTML=entries.filter(x=>x[1].toLowerCase().includes(q.toLowerCase())).map(([id,n])=>`<button onclick="closeDialog();navigate('${id}')">${n} <span style="float:right;color:var(--muted)">↗</span></button>`).join('')||'<p>No matching modules. Try a broader name.</p>'}
function inspectQueue(i){const m=modules[app.module]||modules.dashboard,r=m.attention[i];dialog(r[0],`<p>${r[1]}. This is an illustrative queue, not a live filtered result.</p><div class="scopebox"><b>${r[2]} items in the overview sample</b><br>In the application, this action should open authorized source records with the relevant queue filter applied.</div>`,btn('Close',"closeDialog()")+btn('Explore workspace',"closeDialog();"+(app.module==='foundation'?"navigate('operations','workspace')":"openWorkspace()"),true))}
function periodDialog(){dialog('Reporting period','<p>This review uses one coherent September 2026 sample. Production controls should load the selected period from the authorized data contract.</p><label class="field">Period<select><option>September 2026 · sample</option></select></label>',btn('Apply sample period',"closeDialog();toast('September 2026 sample selected')",true))}
function showNotifications(){dialog('Notifications','<p>Illustrative updates from your programme.</p>'+activities(),btn('Open operations',"closeDialog();navigate('operations')",true))}
function notesDialog(){dialog('Notes & meetings','<p>Community Stories · record conversation</p><div class="scopebox"><b>Brief confirmed</b><br>First draft is ready for review before publication.<br><small>Meera Das · 14 Sep 2026, 09:40</small></div><label class="field" style="margin-top:17px">Preview note<textarea id="previewnote" placeholder="Write a note…"></textarea></label>',btn('Close',"closeDialog()")+btn('Preview note',"previewNote()",true))}function previewNote(){if(!$('previewnote').value.trim())return $('previewnote').focus();closeDialog();toast('Note preview complete. No record was saved.')}
function historyDialog(){dialog('Record history','<p>Append-only history remains attached to the canonical record.</p>'+activities(),btn('Close',"closeDialog()"))}
function reviewDialog(){dialog('Review submission','<p>Community Stories · Instagram Reel 01</p><div class="scopebox"><b>Submitted by Ananya Rao</b><br>Due 18 Sep 2026 · Meera Das is the responsible owner.</div><div class="kv"><span>Content evidence</span><b>Not attached in this visual preview</b></div><div class="kv"><span>Published link</span><b>Not submitted</b></div><p style="margin-top:16px">The live workflow must inspect actual evidence and authorized lifecycle transitions before recording a decision.</p>',btn('Close review',"closeDialog()")+btn('Preview review feedback',"closeDialog();toast('Review feedback previewed. No lifecycle state changed.')",true))}
function conflictDialog(){dialog('This record has changed','<p>Another update arrived after you opened the record. Compare the changes before retrying.</p><div class="kv"><span>Your version</span><b>Owner: Meera Das</b></div><div class="kv"><span>Latest version</span><b>Owner: Arjun Nair</b></div>',btn('Keep reviewing',"closeDialog()")+btn('Load latest preview',"closeDialog();toast('Latest version preview loaded. No saved changes were overwritten.')",true))}
function openAnalyticsContext(){dialog('Metric definitions','<div class="kv"><span>Views</span><b>Native platform view counts</b></div><div class="kv"><span>Interactions</span><b>Source-supported interaction totals</b></div><div class="kv"><span>Reach</span><b>Only from a genuine reach source</b></div><div class="scopebox">Never derive reach from views and present it as measured data. Missing platform actuals stay unknown.</div>',btn('Close',"closeDialog()"))}
function checkDuplicate(){const vals=['email','phone','profile','handle'].map(id=>$(id)?.value.toLowerCase().trim()||'');const hit=vals.some(v=>['ananya@example.test','+919000000001','https://example.test/ananya','@ananya','ananya'].includes(v));$('duplicate').innerHTML=hit?'<div class="banner" style="margin:0"><span><b>Possible existing record</b><br>Review the identifier before creating a new profile. Match details are limited to authorized scope.</span></div>':vals.some(Boolean)?'<small>Local example check: no matching sample identifier.</small>':''}
function saveForm(e){e.preventDefault();const name=$('fullname').value.trim();if(!name){$('fullname').setCustomValidity('Enter a name.');$('fullname').reportValidity();$('fullname').oninput=()=>$('fullname').setCustomValidity('');return}dialog('Review '+(app.module==='administration'?'provisioning':'record'),`<p>Confirm the information in this local preview.</p><div class="kv"><span>Name</span><b>${esc(name)}</b></div><div class="kv"><span>Email</span><b>${esc($('email').value)}</b></div><div class="kv"><span>Region / scope</span><b>${esc($('region').value)}</b></div><div class="scopebox">This file does not create records, grant access, or persist entered values.</div>`,btn('Back to form',"closeDialog()")+btn('Finish preview',"closeDialog();openWorkspace();toast('Preview completed. No live record was created.')",true))}
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}if(e.key==='Escape')toggleNav(false)});$('dialog').addEventListener('click',e=>{if(e.target===$('dialog')){const r=$('dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog()}});
const hash=location.hash.slice(1).split('/');if(hash[0]==='foundation'){app.module='foundation';app.view='foundation'}else if(modules[hash[0]]){app.module=hash[0];app.tab=hash[1]==='workspace'?'workspace':'overview'}render();
</script></body></html>
